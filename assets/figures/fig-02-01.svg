<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">图2-1 企业四要素</title>
  <desc id="description">图示以企业四要素为中心，围绕核心价值、关键技能、综合资源和主打领域展开，并说明其与利益相关方、内外资源、实质性议题和复合价值的关系。</desc>
  <defs>
    <style>
      .txt{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#111}.title{font-size:43px;font-weight:700}.main{font-size:39px;font-weight:700}.node{font-size:34px;font-weight:700}.note{font-size:27px;font-weight:600}.outer{fill:none;stroke:#3e4848;stroke-width:4}.link{stroke:#343c3d;stroke-width:4}.diamond{fill:#474f50}.center{fill:#818989;stroke:#454c4d;stroke-width:3}.nodefill{fill:#7b8384;stroke:#454c4d;stroke-width:3}.white{fill:#fff}
    </style>
  </defs>
  <text x="720" y="75" text-anchor="middle" class="txt title">宗旨和方针决定增长发展</text>
  <text x="720" y="126" text-anchor="middle" class="txt title">创造经济社环三重复合价值</text>
  <polygon points="720,170 1145,410 720,650 295,410" class="outer"/>
  <line x1="720" y1="170" x2="720" y2="650" class="link"/>
  <line x1="295" y1="410" x2="1145" y2="410" class="link"/>

  <polygon points="720,186 835,301 720,416 605,301" class="diamond"/>
  <text x="720" y="315" text-anchor="middle" class="txt node white">核心价值</text>
  <polygon points="338,410 453,295 568,410 453,525" class="diamond"/>
  <text x="453" y="424" text-anchor="middle" class="txt node white">关键技能</text>
  <polygon points="872,410 987,295 1102,410 987,525" class="diamond"/>
  <text x="987" y="424" text-anchor="middle" class="txt node white">综合资源</text>
  <polygon points="720,404 835,519 720,634 605,519" class="diamond"/>
  <text x="720" y="533" text-anchor="middle" class="txt node white">主打领域</text>
  <circle cx="720" cy="410" r="111" class="center"/>
  <text x="720" y="424" text-anchor="middle" class="txt main white">企业四要素</text>

  <text x="128" y="320" class="txt note">回应利益相关方诉求</text>
  <text x="128" y="365" class="txt note">发挥解决问题的能力</text>
  <line x1="287" y1="345" x2="410" y2="390" class="link"/>
  <text x="1030" y="320" class="txt note">链接和整合内外资源</text>
  <text x="1030" y="365" class="txt note">撬动全周期生态效能</text>
  <line x1="1030" y1="390" x2="1148" y2="345" class="link"/>
  <text x="720" y="765" text-anchor="middle" class="txt note">精准锚定实质性议题</text>
  <text x="720" y="810" text-anchor="middle" class="txt note">创造复合价值强化竞争力</text>
  <line x1="720" y1="650" x2="720" y2="720" class="link"/>
</svg>
