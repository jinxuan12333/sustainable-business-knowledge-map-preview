<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 940" role="img" aria-labelledby="title description">
  <title id="title">图2-5 ESG系统性量化体系建立的“5标法”</title>
  <desc id="description">对标、定标、贯标、测标、达标五个阶段构成的ESG系统性量化体系，达标后经由PDCA持续改进回到贯标。</desc>
  <defs><style>.txt{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172d29}.node{fill:#fbfaf6;stroke:#1d6e61;stroke-width:5}.name{font-size:42px;font-weight:800}.item{font-size:28px;font-weight:600}.line{stroke:#1d6e61;stroke-width:5;fill:none;marker-end:url(#a)}.arc{stroke:#1d6e61;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d6e61"/></marker></defs>
  <rect width="1700" height="940" fill="#fbfaf6"/>
  <path d="M235 220 H430 M565 220 H760 M895 220 H1090 M1225 220 H1420" class="line"/>
  <path d="M1410 200 C1410 40 1050 40 1050 200" class="arc"/><text x="1230" y="72" text-anchor="middle" class="txt name">PDCA</text><text x="1230" y="112" text-anchor="middle" class="txt item">持续改善</text>
  <g><circle cx="160" cy="220" r="75" class="node"/><text x="160" y="235" text-anchor="middle" class="txt name">对标</text><text x="80" y="350" class="txt item">• 国际标准</text><text x="80" y="395" class="txt item">• 区域标准</text><text x="80" y="440" class="txt item">• 行业标准</text><text x="80" y="485" class="txt item">• 国家标准</text><text x="80" y="530" class="txt item">• 市场监管</text></g>
  <g><circle cx="495" cy="220" r="75" class="node"/><text x="495" y="235" text-anchor="middle" class="txt name">定标</text><text x="405" y="350" class="txt item">• 企业宗旨</text><text x="405" y="395" class="txt item">• 增长与发展目标</text><text x="405" y="440" class="txt item">• 可持续商业战略</text><text x="405" y="485" class="txt item">• 风险管控</text><text x="405" y="530" class="txt item">• 长期价值</text><text x="405" y="575" class="txt item">• 全生命周期</text><text x="405" y="620" class="txt item">• 全价值链生态</text></g>
  <g><circle cx="825" cy="220" r="75" class="node"/><text x="825" y="235" text-anchor="middle" class="txt name">贯标</text><text x="735" y="350" class="txt item">• 落实到全员全流程</text><text x="735" y="395" class="txt item">• 伴随变革管理</text><text x="735" y="440" class="txt item">• 落实到供应链管理</text><text x="735" y="485" class="txt item">• 形成新的作业规范</text></g>
  <g><circle cx="1155" cy="220" r="75" class="node"/><text x="1155" y="235" text-anchor="middle" class="txt name">测标</text><text x="1065" y="350" class="txt item">• 指标管理体系</text><text x="1065" y="395" class="txt item">• 数字化智能化</text><text x="1065" y="440" class="txt item">• 动态反馈机制</text><text x="1065" y="485" class="txt item">• 精益改善</text></g>
  <g><circle cx="1495" cy="220" r="75" class="node"/><text x="1495" y="235" text-anchor="middle" class="txt name">达标</text><text x="1405" y="350" class="txt item">• 信息披露</text><text x="1405" y="395" class="txt item">• 利益相关方沟通</text><text x="1405" y="440" class="txt item">• ESG评级</text></g>
</svg>
