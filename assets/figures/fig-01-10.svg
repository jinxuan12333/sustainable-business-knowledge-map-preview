  <path d="M458 542 A286 286 0 0 0 982 542" class="arc"/>
  <text x="720" y="675" text-anchor="middle" class="txt medium">绿色可持续的增长与发展</text>

  <circle cx="720" cy="338" r="124" class="circle"/>
  <text x="720" y="352" text-anchor="middle" class="txt large white">环境</text>
  <circle cx="620" cy="510" r="124" class="circle"/>
