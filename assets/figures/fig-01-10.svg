<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" role="img" aria-labelledby="title description">
  <title id="title">图1-10 可持续商业战略思维的“1—2—3”底层逻辑流程</title>
  <desc id="description">企业宗旨、战略、公司治理、行动、财务绩效与社会绩效围绕市场战略和非市场战略展开；中心由环境、社会、经济以及经济属性、社会属性构成。</desc>
  <defs>
    <style>
      .frame{fill:none;stroke:#5d6c6d;stroke-width:2;stroke-dasharray:2 8}.label{fill:#273d3c}.dark{fill:#2e3738}.ring{fill:none;stroke:#879292;stroke-width:6}.circle{fill:#767f80;stroke:#4a5555;stroke-width:2}.light{fill:#faf9f4;stroke:#4a5555;stroke-width:2}.txt{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#111}.small{font-size:27px;font-weight:600}.medium{font-size:33px;font-weight:700}.large{font-size:43px;font-weight:700}.white{fill:#fff}.line{stroke:#202829;stroke-width:4;fill:none}.arc{fill:none;stroke:#202829;stroke-width:3}.diamond{fill:#303839}.box{fill:#3e4647}
    </style>
  </defs>
  <rect x="86" y="88" width="1268" height="670" class="frame"/>

  <rect x="112" y="110" width="170" height="56" class="box"/>
  <text x="197" y="150" text-anchor="middle" class="txt medium white">企业宗旨</text>
  <rect x="1158" y="110" width="172" height="56" class="box"/>
  <text x="1244" y="150" text-anchor="middle" class="txt medium white">公司治理</text>
  <rect x="110" y="683" width="170" height="56" class="box"/>
  <text x="195" y="723" text-anchor="middle" class="txt medium white">财务绩效</text>
  <rect x="1160" y="683" width="170" height="56" class="box"/>
  <text x="1245" y="723" text-anchor="middle" class="txt medium white">社会绩效</text>

  <circle cx="720" cy="100" r="50" class="circle"/>
  <text x="720" y="115" text-anchor="middle" class="txt large white">战略</text>
  <circle cx="720" cy="790" r="50" class="circle"/>
  <text x="720" y="806" text-anchor="middle" class="txt large white">行动</text>
  <line x1="720" y1="152" x2="720" y2="205" class="line"/>
  <line x1="720" y1="694" x2="720" y2="740" class="line"/>

  <polygon points="92,390 220,275 348,390 220,505" class="diamond"/>
  <text x="220" y="360" text-anchor="middle" class="txt medium white">企业确立实质性</text>
  <text x="220" y="406" text-anchor="middle" class="txt medium white">议题</text>
  <line x1="348" y1="390" x2="444" y2="390" class="line"/>
  <text x="397" y="377" text-anchor="middle" class="txt medium">市场战略</text>

  <polygon points="1092,390 1220,275 1348,390 1220,505" class="diamond"/>
  <text x="1220" y="358" text-anchor="middle" class="txt medium white">创新韧性责任</text>
  <text x="1220" y="405" text-anchor="middle" class="txt medium white">竞争力</text>
  <line x1="996" y1="390" x2="1092" y2="390" class="line"/>
  <text x="1044" y="377" text-anchor="middle" class="txt medium">非市场战略</text>

  <circle cx="720" cy="452" r="286" class="ring"/>
  <path d="M456 358 A286 286 0 0 1 984 358" class="arc"/>
