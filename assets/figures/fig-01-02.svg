<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" role="img" aria-labelledby="title description">
  <title id="title">图1-2 ESG 的概念及内涵</title>
  <desc id="description">以环境、社会、治理三栏列示原书中的ESG议题示例。</desc>
  <defs><style>.txt{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#18302c}.head{font-size:42px;font-weight:800;fill:#fff}.item{font-size:28px;font-weight:600}.box{fill:#f6f3ea;stroke:#1d6e61;stroke-width:4}.bar{fill:#1d6e61}.mark{fill:#1d6e61}</style></defs>
  <rect width="1680" height="1180" fill="#fbfaf6"/>
  <g transform="translate(80 72)"><rect width="460" height="980" class="box"/><rect width="460" height="96" class="bar"/><text x="230" y="63" text-anchor="middle" class="txt head">环境（E）</text><g class="txt item"><text x="62" y="156">□ 气候变化</text><text x="62" y="212">□ 废弃物管理</text><text x="62" y="268">□ 能源效率</text><text x="62" y="324">□ 水资源消耗</text><text x="62" y="380">□ 水和空气污染控制</text><text x="62" y="436">□ 碳足迹</text><text x="62" y="492">□ 生物多样性</text><text x="62" y="548">□ 自然资源保护</text><text x="62" y="604">□ 绿色技术</text><text x="62" y="660">□ 环保投入</text><text x="62" y="716">□ 绿色办公</text><text x="62" y="772">□ 员工环境意识</text><text x="62" y="828">□ 可再生能源开发</text><text x="62" y="884">□ 环保建筑建造</text><text x="62" y="940">□ 产品和服务的生命周期影响</text></g></g>
  <g transform="translate(610 72)"><rect width="460" height="980" class="box"/><rect width="460" height="96" class="bar"/><text x="230" y="63" text-anchor="middle" class="txt head">社会（S）</text><g class="txt item"><text x="62" y="156">□ 供应链管理</text><text x="62" y="212">□ 安全与健康</text><text x="62" y="268">□ 产品/服务质量安全</text><text x="62" y="324">□ 客户管理</text><text x="62" y="380">□ 雇员管理</text><text x="62" y="436">□ 人力资源开发</text><text x="62" y="492">□ 社区关系</text><text x="62" y="548">□ 人才吸引与保留</text><text x="62" y="604">□ 性别及性别平衡政策</text><text x="62" y="660">□ 人权政策</text><text x="62" y="716">□ 童工保护</text><text x="62" y="772">□ 反歧视</text><text x="62" y="828">□ 数据与隐私安全</text><text x="62" y="884">□ 公司税收贡献</text><text x="62" y="940">□ 乡村振兴</text></g></g>
  <g transform="translate(1140 72)"><rect width="460" height="980" class="box"/><rect width="460" height="96" class="bar"/><text x="230" y="63" text-anchor="middle" class="txt head">治理（G）</text><g class="txt item"><text x="56" y="156">□ 治理机构及议事规则</text><text x="56" y="212">□ 股权架构及股东权利</text><text x="56" y="268">□ 董事会多样性</text><text x="56" y="324">□ 薪酬体系及激励结构</text><text x="56" y="380">□ 会计政策及审计实践</text><text x="56" y="436">□ 道德行为准则</text><text x="56" y="492">□ 合规管理（视行业特征及企业情况）</text><text x="90" y="544">· 反垄断　· 反腐败　· 反贿赂</text><text x="90" y="596">· 反洗钱　· 商业及供应链合规</text><text x="90" y="648">· 环境、职业健康与安全合规</text><text x="90" y="700">· 数据安全与个人信息合规</text><text x="90" y="752">· 知识产权、贸易与进出口合规</text><text x="90" y="804">· 劳动与人事合规</text><text x="56" y="860">□ ESG风险识别与管理</text><text x="56" y="916">□ 利益相关方关系</text><text x="56" y="972">□ 信息披露</text></g></g>
</svg>
